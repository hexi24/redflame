
                        </div>
                        <button onclick="resetModal()" class="mt-8 text-gray-600 hover:text-white text-[10px] uppercase tracking-[0.4em] font-black transition-all">Powrót do cen</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1504547756197548193/5ZDaW8ge7aVkdtNWWjVz9-onYZziLm_PHW9XJ5m_3pXigl48Vrrkc2_YTrJUVO7cGSlD";

        const PROMO_CODES = {
            "TOMEO": 0.10,
            "START": 0.05,
            "FLAME": 0.15,
            "PREMIUM": 0.20,
            "MOTION": 0.10
        };

        const creators = [
            { name: "tworca", subs: "5.2M", img: "" }, { name: "tworca", subs: "4.8M", img: "" },
            { name: "tworca", subs: "5.0M", img: "" }, { name: "JacaYT", subs: "24k", img: "tworca2" },
            { name: "tworca", subs: "2.9M", img: "" }, { name: "TomeoPL", subs: "12k", img: "tworca1" },
            { name: "tworca", subs: "2.1M", img: "" }
        ];

        const mainAnimations = [
            { title: "Wejscie na Serwer", video: "animwejscienaserwer.mp4", desc: "Animacja Wejscia na Serwer w dobrej cenie", buy: 25, rent: 12 },
            { title: "animacja 3 map", video: "animacja 3 map.mp4", desc: "W Pełni edytowalna animacja 3 map.", buy: 20, rent: 10 },
            { title: "wkrotce", video: "", desc: "wkrotce.", buy: 120, rent: 29 }
        ];

        const libraryAnimations = [
            { title: "animacja przewijania itemu", video: "animacja 4.mp4", desc: "animacja przewijania itemkow.", buy: 10, rent: 5 },
            { title: "wkrotce", video: "animacja5.mp4", desc: "wkrotce.", buy: 79, rent: 25 },
            { title: "wkrotce", video: "animacja6.mp4", desc: "wkrotce.", buy: 90, rent: 30 },
            { title: "wkrotce", video: "animacja7.mp4", desc: "wkrotce.", buy: 110, rent: 35 },
            { title: "wkrotce", video: "animacja8.mp4", desc: "wkrotce.", buy: 60, rent: 20 },
            { title: "wkrotce", video: "animacja9.mp4", desc: "wkrotce.", buy: 85, rent: 25 }
        ];

        let chartInstance = null;
        let currentProject = null;
        let activeDiscount = 0;
        let activePromoCode = "";

        function createSparks() {
            const container = document.getElementById('sparks-container');
            for(let i=0; i<35; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                spark.style.left = (Math.random() < 0.5 ? Math.random()*15 : 85 + Math.random()*15) + 'vw';
                spark.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(spark);
            }
        }

        function initTicker() {
            const container = document.getElementById('ticker-content');
            const items = creators.map(c => `
                <div class="flex items-center gap-6 px-16">
                    <div class="w-12 h-12 rounded-full bg-[#ff3333]/5 border border-[#ff3333]/20 flex items-center justify-center font-bold text-[#ff3333]">${c.name[0]}</div>
                    <div class="flex flex-col">
                        <span class="font-bold text-sm text-white">${c.name}</span>
                        <span class="text-[8px] text-[#ff3333] font-black uppercase italic">${c.subs} SUBS</span>
                    </div>
                </div>
            `).join('');
            container.innerHTML = items + items;
        }

        function renderPortfolio(data, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = data.map(anim => `
                <div class="group cursor-pointer reveal" onclick='openProject(${JSON.stringify(anim).replace(/'/g, "&apos;")})'>
                    <div class="aspect-video bg-white/5 rounded-3xl border border-white/5 overflow-hidden group-hover:border-[#ff3333]/40 transition-all relative">
                        <video src="${anim.video}" class="w-full h-full object-cover opacity-60 group-hover:opacity-100" autoplay loop muted playsinline></video>
                        <div class="absolute inset-0 bg-gradient-to-t from-black flex flex-col justify-end p-8">
                             <span class="text-[9px] text-white/40 font-bold tracking-[0.4em] uppercase italic group-hover:text-white transition-all">Pokaż szczegóły &#x2192;</span>
                        </div>
                    </div>
                    <h3 class="mt-8 font-bold text-[11px] tracking-[0.4em] uppercase text-gray-500 group-hover:text-white transition-colors text-center">${anim.title}</h3>
                </div>
            `).join('');
        }

        function openProject(anim) {
            resetModal();
            currentProject = anim;
            activeDiscount = 0;
            activePromoCode = "";
            document.getElementById('modal-video').src = anim.video;
            document.getElementById('modal-proj-title').innerText = anim.title;
            updatePrices();
            document.getElementById('project-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            setTimeout(initProjectChart, 100);
        }

        function applyPromo() {
            const code = document.getElementById('promo-input').value.toUpperCase().trim();
            const msgEl = document.getElementById('promo-msg');
            
            if (PROMO_CODES[code]) {
                activeDiscount = PROMO_CODES[code];
                activePromoCode = code;
                msgEl.innerText = `KOD ZASTOSOWANY! -${activeDiscount * 100}%`;
                msgEl.style.color = "#4ade80";
                updatePrices();
            } else {
                activeDiscount = 0;
                activePromoCode = "";
                msgEl.innerText = "NIEPOPRAWNY KOD";
                msgEl.style.color = "#ff3333";
                updatePrices();
            }
        }

        function updatePrices() {
            const rentVal = currentProject.rent;
            const buyVal = currentProject.buy;
            
            if (activeDiscount > 0) {
                const newRent = Math.round(rentVal * (1 - activeDiscount));
                const newBuy = Math.round(buyVal * (1 - activeDiscount));
                
                document.getElementById('rent-price').innerText = `${newRent} PLN`;
                document.getElementById('rent-old-price').innerText = `${rentVal} PLN`;
                document.getElementById('rent-old-price').classList.remove('hidden');
                
                document.getElementById('buy-price').innerText = `${newBuy} PLN`;
                document.getElementById('buy-old-price').innerText = `${buyVal} PLN`;
                document.getElementById('buy-old-price').classList.remove('hidden');
            } else {
                document.getElementById('rent-price').innerText = `${rentVal} PLN`;
                document.getElementById('buy-price').innerText = `${buyVal} PLN`;
                document.getElementById('rent-old-price').classList.add('hidden');
                document.getElementById('buy-old-price').classList.add('hidden');
            }
        }

        function generateOrder(type) {
            const randomId = Math.floor(1000 + Math.random() * 8999);
            const orderID = `RF-${randomId}-${type}`;
            const finalPrice = type === 'FULL' ? 
                Math.round(currentProject.buy * (1 - activeDiscount)) : 
                Math.round(currentProject.rent * (1 - activeDiscount));

            document.getElementById('modal-initial-state').classList.add('hidden');
            document.getElementById('modal-success-state').classList.remove('hidden');
            document.getElementById('order-id-display').innerText = orderID;
            document.getElementById('copy-hint').innerText = orderID;
            document.getElementById('order-status-msg').innerText = type === 'FULL' ? 'GOTOWY DO KUPNA!' : 'GOTOWY DO NAJMU!';
            
            setTimeout(() => document.getElementById('id-progress').style.width = '100%', 100);
            sendToDiscord(orderID, type, currentProject.title, finalPrice);
        }

        async function sendToDiscord(orderID, type, projectName, price) {
            const data = {
                content: `🚀 **INICJACJA TRANSAKCJI Z KODEM!**`,
                embeds: [{
                    title: `Projekt: ${projectName}`,
                    color: 16724787,
                    fields: [
                        { name: "🆔 ID Zamówienia", value: `\`${orderID}\``, inline: true },
                        { name: "🏷️ Rodzaj", value: type === 'FULL' ? "ZAKUP" : "NAJEM", inline: true },
                        { name: "💰 Cena Końcowa", value: `**${price} PLN**`, inline: true },
                        { name: "🎫 Kod Promo", value: activePromoCode || "Brak", inline: true }
                    ],
                    footer: { text: "System RedFlame v3.0" },
                    timestamp: new Date()
                }]
            };
            try { await fetch(DISCORD_WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }); } catch (e) {}
        }

        function closeProject() {
            document.getElementById('project-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function resetModal() {
            document.getElementById('modal-initial-state').classList.remove('hidden');
            document.getElementById('modal-success-state').classList.add('hidden');
            document.getElementById('id-progress').style.width = '0%';
            document.getElementById('promo-input').value = "";
            document.getElementById('promo-msg').innerText = "";
        }

        function initProjectChart() {
            if (chartInstance) chartInstance.destroy();
            const ctx = document.getElementById('projectChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['P', 'W', 'Ś', 'C', 'P', 'S', 'N'],
                    datasets: [{
                        data: Array.from({length: 7}, () => 40 + Math.floor(Math.random() * 60)),
                        borderColor: '#ff3333', backgroundColor: 'rgba(255, 51, 51, 0.05)',
                        borderWidth: 3, fill: true, tension: 0.4, pointRadius: 0
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { display: false }, y: { display: false } }
                }
            });
        }

        function showMore() {
            document.getElementById('library-section').style.display = 'grid';
            document.getElementById('load-more-container').style.display = 'none';
            setTimeout(initReveal, 100);
        }

        function initReveal() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('active'); });
            }, { threshold: 0.05 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }

        window.onload = () => {
            createSparks();
            initTicker();
            renderPortfolio(mainAnimations, 'portfolio-grid');
            renderPortfolio(libraryAnimations, 'library-section');
            initReveal();
        };
    </script>
</body>
</html>
